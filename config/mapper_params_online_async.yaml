slam_toolbox:
  ros__parameters:
    # Plugins
    solver_plugin: solver_plugins::CeresSolver
    use_sim_time: false
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function_type: NONE

    # ROS Parameters
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    scan_topic: /scan # We will filter/project the Go2's pointcloud to a 2D laser scan here

    # Debug Parameters
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05 # 20Hz TF updates for map -> odom
    map_update_interval: 1.0
    resolution: 0.05 # 5cm per cell accuracy grid
    max_laser_range: 20.0
    minimum_time_interval: 0.1

    # Scan Matcher Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2 # Add node after 20cm movement
    minimum_travel_heading: 0.174 # Add node after 10 degrees turn
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_coarse: 0.1
    link_match_minimum_response_fine: 0.5

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty_vector_multiplier: 5.0
    angle_variance_penalty_vector_multiplier: 1.0
    loop_search_maximum_distance: 5.0
    do_loop_closing: true
    quad_tree_splittable_threshold: 0.17
    max_closed_loop_evidence_coarse: 5.0
    close_loop_detection_skip_factor: 1

