controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    
    # Configure the Local Planner to use the RPP Plugin
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # Base Velocity constraints
      desired_linear_vel: 0.25    # Keep it at a safe, predictable test speed
      max_vel_x: 0.4
      max_vel_y: 0.0              # Keep lateral movement locked out for this raw test
      max_vel_theta: 0.5
      
      # Lookahead Distance parameters
      lookahead_dist: 0.6         # Look 60 cm ahead of the path line
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      
      # --- THE PURE PURSUIT CONTROLLER BYPASSES ---
      # Explicitly turn off all regulatory mathematics to force forward movement
      use_velocity_scaled_lookahead_dist: false
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      use_approach_vel_scaling: false
      
      # Safety overrides to prevent mathematical panic flags
      max_allowed_time_to_collision_after_limit: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      # footprint: "[ [0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20] ]"
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      footprint: "[ [0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20] ]"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.15
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      # footprint: "[ [0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20] ]"
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom # map
      robot_base_frame: base_link
      use_sim_time: false
      always_send_full_costmap: true
      rolling_window: true # Forces map expansion dynamically
      width: 10
      height: 10
      origin_x: -5.0
      origin_y: -5.0
      track_unknown_space: true
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"] #plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.15
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    expected_planner_plugins: ["GridBased"]
    use_sim_time: false
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true  # Forces a straight vector path through empty space
